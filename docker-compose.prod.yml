version: '3.8'

# This file is intended to be used in conjunction with docker-compose.yml
# Example: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  frontend:
    restart: always
    environment:
      - VITE_API_URL=/api/v1
    
  backend:
    restart: always
    environment:
      - APP_ENV=production
      # DB URL should be injected from secure secrets management or env vars in production
      - DATABASE_URL=${DATABASE_URL}
      - SECRET_KEY=${SECRET_KEY}
    command: >
      bash -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4"

  db:
    restart: always
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
